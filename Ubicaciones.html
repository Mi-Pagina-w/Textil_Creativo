<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTIL CREATIVO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="icon" type="image/x-icon" href="Mi_logo.png">
    
    <style>
        :root {
            --tarjeta: rgba(255, 255, 255, 0.88); 
            --acento-rosa: #ff1a8c;
            --acento-celeste: #00b4d8;
            --acento-morado: #7209b7;
            --texto: #221a2d;
        }

        body {
            background-color: #f3ebfc;
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        .watercolor-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            filter: blur(45px);
            opacity: 0.8;
        }

        .splash {
            position: absolute;
            border-radius: 50%;
        }

        .splash-1 {
            top: -10%;
            left: -10%;
            width: 55vw;
            height: 55vw;
            background: #ff66b2;
        }

        .splash-2 {
            bottom: -15%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: #4cc9f0;
        }

        .splash-3 {
            top: 30%;
            left: 20%;
            width: 45vw;
            height: 45vw;
            background: #b5179e;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            z-index: 1;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .main-logo {
            max-width: 170px;
            height: auto;
            border-radius: 12px;
            border: 2px solid rgba(0, 180, 216, 0.5);
            box-shadow: 0 8px 25px rgba(114, 9, 183, 0.2);
            background-color: #ffffff;
            padding: 6px;
        }

        h1 {
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            background: linear-gradient(45deg, #ff1a8c, #00b4d8, #7209b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.15));
            transform: rotate(-1deg);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background-color: var(--tarjeta);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--texto);
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(34, 26, 45, 0.1);
        }

        .link-card:hover {
            border-color: var(--acento-rosa);
            transform: scale(1.05);
            background-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 12px 28px rgba(255, 26, 140, 0.25);
        }

        .link-card i {
            margin-right: 12px;
            font-size: 1.4rem;
            width: 24px;
            text-align: center;
            color: var(--acento-celeste);
            transition: color 0.3s ease;
        }

        .link-card:hover i {
            color: var(--acento-rosa);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            opacity: 0.85;
            color: #48375c;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="Mi_logo.png" alt="Logo Textil Creativo" class="main-logo">
        </div>
        <h1>TEXTIL CREATIVO</h1>
        <div class="links-container">
            <a href="https://maps.app.goo.gl/HRZA6o6hZFgFyBBeA" class="link-card" target="_blank">
                <i class="fa-solid fa-location-dot"></i> Salitre
            </a>
            <a href="index.html" class="link-card">
                <i class="fa-solid fa-arrow-left"></i> Regresar
            </a>
        </div>
        <p class="footer">© 2026 • TEXTIL CREATIVO • TU IDEA, EN TUS PRENDAS</p>
    </div>
</body>
</html>
